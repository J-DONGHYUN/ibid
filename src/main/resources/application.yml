spring:
  application:
    name: ibid
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ap-northeast-2
      s3:
        bucket: ${AWS_S3_BUCKET:ibid-product-images}

server:
  shutdown: graceful

product:
  view:
    dedup-ttl: ${PRODUCT_VIEW_DEDUP_TTL:PT30M}
    cookie-max-age: ${PRODUCT_VIEW_COOKIE_MAX_AGE:31536000}
    flush-interval: ${PRODUCT_VIEW_FLUSH_INTERVAL:60000}

jwt:
  access:
    secret: ${JWT_ACCESS_SECRET:local-access-secret-change-me-0123456789}
    expiration: ${JWT_ACCESS_EXPIRATION:1800000}
  refresh:
    secret: ${JWT_REFRESH_SECRET:local-refresh-secret-change-me-0123456789}
    expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
