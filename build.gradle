plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'project.kjhjdh'
version = '0.0.1-SNAPSHOT'
description = 'ibid'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.security:spring-security-crypto'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.2.1'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.rest-assured:spring-mock-mvc'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:rabbitmq'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('architectureTest', Test) {
    description = '아키텍처 · 소스 · 테스트 컨벤션 게이트만 돌린다. 스프링과 Docker 없이 수 초 안에 끝난다 (ADR-0010)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'project.kjhjdh.ibid.architecture.*'
    }
}

def frozenStoreDir = layout.projectDirectory.dir('src/test/resources/archunit-store').asFile

def readFrozenStore = {
    Map<String, Set<String>> snapshot = [:]
    if (frozenStoreDir.exists()) {
        frozenStoreDir.eachFile { f ->
            if (f.isFile()) {
                snapshot[f.name] = f.readLines('UTF-8').findAll { !it.startsWith('#') }.toSet()
            }
        }
    }
    snapshot
}

tasks.withType(Test).configureEach {
    def before = [:]
    doFirst {
        before.putAll(readFrozenStore())
    }
    doLast {
        def after = readFrozenStore()
        def created = after.keySet() - before.keySet()
        def grown = after.findAll { name, lines -> before.containsKey(name) && !before[name].containsAll(lines) }.keySet()
        if (created || grown) {
            throw new GradleException(
                    "ArchUnit 이 동결 저장소(src/test/resources/archunit-store/)에 새 항목을 기록했다 — 새 파일 ${created}, 늘어난 파일 ${grown}.\n" +
                    "저장소에 없는 규칙은 처음 보이는 순간 현재 위반을 전부 받아들여 통과한다. 사람이 항목을 확인하고 커밋해야 게이트가 닫힌다.\n" +
                    "위반을 고치는 게 먼저다. 의도한 새 동결이면 git diff 로 기록된 위반 수를 확인해 커밋한 뒤 다시 돌린다 (ADR-0010, harness.md 「알려진 구멍」)")
        }
    }
}
