name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: 아키텍처 게이트 (빠른 실패)
        run: ./gradlew architectureTest

      - name: 빌드 + 전체 테스트
        run: ./gradlew build
        env:
          AWS_ACCESS_KEY: test
          AWS_SECRET_KEY: test
